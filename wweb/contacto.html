<section id="contacto" class="contacto-section">

    <h2 class="contacto-titulo">Contacto / Petición de oración</h2>

    <div class="contacto-container">

        <form class="contacto-form">

            <h3>Escribe tu petición o mensaje</h3>

            <div class="campo">
                <label>Nombre</label>
                <input type="text" placeholder="Tu nombre">
            </div>

            <div class="campo">
                <label>Teléfono</label>
                <input type="tel" placeholder="Tu teléfono">
            </div>

            <div class="campo">
                <label>Correo</label>
                <input type="email" placeholder="Tu correo">
            </div>

            <div class="campo">
                <label>Petición de oración</label>
                <textarea placeholder="Escribe tu petición de oración..."></textarea>
            </div>

            <button type="submit">🙏 Enviar petición</button>

        </form>

    </div>
