```html id="kzcn11"
<section class="contacto-section">

    <h2 class="titulo-contacto">
        Contáctame
    </h2>

    <p class="texto-contacto">
        Completa el formulario y me pondré en contacto contigo lo antes posible.
    </p>

    <form class="formulario">

        <fieldset>

            <legend>
                Formulario de Contacto
            </legend>

            <div class="contenedor-campos">

                <div class="campo">

                    <label>
                        Nombre Completo
                    </label>

                    <input
                        class="input-text"
                        type="text"
                        placeholder="Ingresa tu nombre"
                    >

                </div>

                <div class="campo">

                    <label>
                        Número Telefónico
                    </label>

                    <input
                        class="input-text"
                        type="tel"
                        placeholder="Ingresa tu teléfono"
                    >

                </div>

                <div class="campo">

                    <label>
                        Correo Electrónico
                    </label>

                    <input
                        class="input-text"
                        type="email"
                        placeholder="Ingresa tu correo"
                    >

                </div>

                <div class="campo">

                    <label>
                        Mensaje
                    </label>

                    <textarea
                        class="input-text"
                        placeholder="Escribe tu mensaje aquí"
                    ></textarea>

                </div>

            </div>

            <div class="alinear-derecha flex">

                <input
                    class="boton w-sm-100"
                    type="submit"
                    value="Enviar Mensaje"
                >

            </div>

        </fieldset>

    </form>

</section>
```
